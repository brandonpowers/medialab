x-common-env: &common-env
  PUID: ${PUID}
  PGID: ${PGID}
  TZ: ${TZ}

x-common-vol: &common-vol
  ${MEDIA_ROOT}:/media

# Logging configuration to prevent disk space issues
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

# Security hardening - applied to all containers
# no-new-privileges: Prevents privilege escalation via setuid/setgid binaries
# cap_drop ALL: Removes all Linux capabilities (principle of least privilege)
# cap_add: Restores minimum required capabilities for container functionality
x-security: &default-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add:
    - CHOWN           # Change file ownership
    - SETUID          # Switch user ID (needed for init systems)
    - SETGID          # Switch group ID (needed for init systems)
    - DAC_OVERRIDE    # Bypass file permission checks
    - FOWNER          # Bypass permission checks requiring file owner

services:
  # ============================================
  # REMOTE ACCESS & NETWORKING
  # ============================================

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    <<: *default-security
    logging: *default-logging

  # ============================================
  # PUBLIC USER-FACING SERVICES
  # (Accessible via Cloudflare Tunnel)
  # ============================================

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    ports:
      - "3000:3000"
    user: "${PUID}:${PGID}"
    group_add:
      - "${DOCKER_GID}"  # docker group for socket access
    environment:
      TZ: ${TZ}
      HOMEPAGE_ALLOWED_HOSTS: "*"
      # API keys for service widgets (substituted into config via {{HOMEPAGE_VAR_*}})
      HOMEPAGE_VAR_JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
      HOMEPAGE_VAR_JELLYSEERR_API_KEY: ${JELLYSEERR_API_KEY:-}
      HOMEPAGE_VAR_SONARR_API_KEY: ${SONARR_API_KEY:-}
      HOMEPAGE_VAR_RADARR_API_KEY: ${RADARR_API_KEY:-}
      HOMEPAGE_VAR_LIDARR_API_KEY: ${LIDARR_API_KEY:-}
      HOMEPAGE_VAR_PROWLARR_API_KEY: ${PROWLARR_API_KEY:-}
      HOMEPAGE_VAR_BAZARR_API_KEY: ${BAZARR_API_KEY:-}
      HOMEPAGE_VAR_SABNZBD_API_KEY: ${SABNZBD_API_KEY:-}
      HOMEPAGE_VAR_QBIT_USER: ${QBIT_USER:-admin}
      HOMEPAGE_VAR_QBIT_PASS: ${QBIT_PASS:-}
    volumes:
      - ./data/homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    <<: *default-security
    logging: *default-logging

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "8096:8096"
      - "8920:8920"
    environment:
      <<: *common-env
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ./data/jellyfin/config:/config
      - ./data/jellyfin/cache:/cache
      - ${MEDIA_ROOT}:/media  # Read-write access to allow deletion from Jellyfin UI
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    <<: *default-security
    logging: *default-logging

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    restart: unless-stopped
    ports:
      - "5055:5055"
    environment:
      <<: *common-env
    volumes:
      - ./data/jellyseerr/config:/app/config
    <<: *default-security
    logging: *default-logging

  # ============================================
  # PRIVATE ADMIN SERVICES
  # (Access via LAN only)
  # ============================================

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    ports:
      - "8989:8989"
    environment:
      <<: *common-env
    volumes:
      - ./data/sonarr/config:/config
      - *common-vol
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/ping"]
      interval: 60s
      timeout: 10s
      retries: 3
    <<: *default-security
    logging: *default-logging

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    ports:
      - "7878:7878"
    environment:
      <<: *common-env
    volumes:
      - ./data/radarr/config:/config
      - *common-vol
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878/ping"]
      interval: 60s
      timeout: 10s
      retries: 3
    <<: *default-security
    logging: *default-logging

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    restart: unless-stopped
    ports:
      - "8686:8686"
    environment:
      <<: *common-env
    volumes:
      - ./data/lidarr/config:/config
      - *common-vol
    <<: *default-security
    logging: *default-logging

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    ports:
      - "9696:9696"
    environment:
      <<: *common-env
    volumes:
      - ./data/prowlarr/config:/config
      - *common-vol
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9696/ping"]
      interval: 60s
      timeout: 10s
      retries: 3
    <<: *default-security
    logging: *default-logging

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    ports:
      - "8191:8191"
    environment:
      LOG_LEVEL: info
      LOG_HTML: false
      CAPTCHA_SOLVER: none
      TZ: ${TZ}
    <<: *default-security
    logging: *default-logging

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    ports:
      - "6767:6767"
    environment:
      <<: *common-env
    volumes:
      - ./data/bazarr/config:/config
      - *common-vol
    <<: *default-security
    logging: *default-logging

  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:latest
    container_name: recyclarr
    restart: unless-stopped
    user: ${PUID}:${PGID}
    environment:
      TZ: ${TZ}
    volumes:
      - ./data/recyclarr/config:/config
    <<: *default-security
    logging: *default-logging

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    environment:
      <<: *common-env
      WEBUI_PORT: 8080
    volumes:
      - ./data/qbittorrent/config:/config
      - ${MEDIA_ROOT}/downloads:/downloads
      - *common-vol
    <<: *default-security
    logging: *default-logging

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      <<: *common-env
    volumes:
      - ./data/sabnzbd/config:/config
      - ${MEDIA_ROOT}/downloads:/downloads
      - *common-vol
    <<: *default-security
    logging: *default-logging

  tdarr:
    image: ghcr.io/haveagitgat/tdarr:latest
    container_name: tdarr
    restart: unless-stopped
    ports:
      - "8265:8265"  # Web UI
      - "8266:8266"  # Server port
    environment:
      <<: *common-env
      serverIP: 0.0.0.0
      serverPort: 8266
      webUIPort: 8265
      internalNode: "true"
      nodeName: HomeLabNode
      # Authentication - seededApiKey pre-creates an API key for automated deployments
      # Note: First user must still be created via web UI, but API access works with this key
      serverAuth: "true"
      seededApiKey: ${TDARR_API_KEY:-}
      # Internal node uses same API key to connect to server
      apiKey: ${TDARR_API_KEY:-}
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ./data/tdarr/server:/app/server
      - ./data/tdarr/configs:/app/configs
      - ./data/tdarr/logs:/app/logs
      - ./data/tdarr/temp:/temp
      - ${MEDIA_ROOT}:/media  # Read-write for transcoding ARM rips
    <<: *default-security
    logging: *default-logging

  arm:
    image: automaticrippingmachine/automatic-ripping-machine:latest
    container_name: arm
    restart: unless-stopped
    privileged: true  # Required for full optical drive access and udev integration
    ports:
      - "8090:8080"  # Web UI
    environment:
      <<: *common-env
      ARM_UID: ${PUID}
      ARM_GID: ${PGID}
    devices:
      - ${OPTICAL_DRIVE:-/dev/sr0}:${OPTICAL_DRIVE:-/dev/sr0}  # Auto-detected optical drive
      - ${OPTICAL_SG_DEVICE:-/dev/sg1}:${OPTICAL_SG_DEVICE:-/dev/sg1}  # SCSI generic device
      - /dev/dri:/dev/dri  # GPU hardware acceleration for transcoding
    volumes:
      - ./data/arm/home:/home/arm  # Mount entire home dir to control permissions
      - ./data/arm/config:/etc/arm/config
      - ${MEDIA_ROOT}/arm:/home/arm/media  # Temporary storage during ripping (on external drive)
      - ${MEDIA_ROOT}:/home/arm/movies  # Final output (ARM adds movies/ or tv/ subfolder)
      - /run/udev:/run/udev:ro  # udev events for automatic disc detection
    # Override default healthcheck - udevd check fails in container (udev events come from host)
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://$(hostname -i):8080 || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *default-logging
