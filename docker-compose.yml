x-common-env: &common-env
  PUID: ${PUID}
  PGID: ${PGID}
  TZ: ${TZ}

x-common-vol: &common-vol
  ${MEDIA_ROOT}:/media

# Logging configuration to prevent disk space issues
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ============================================
  # REMOTE ACCESS & NETWORKING
  # ============================================

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    logging: *default-logging
    # Alternative: mount config file
    # volumes:
    #   - ./data/cloudflared:/etc/cloudflared

  # ============================================
  # PUBLIC USER-FACING SERVICES
  # (Accessible via Cloudflare Tunnel)
  # ============================================

  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    container_name: homarr
    restart: unless-stopped
    ports:
      - "7575:7575"
    environment:
      SECRET_ENCRYPTION_KEY: ${HOMARR_ENCRYPTION_KEY}
    volumes:
      - ./data/homarr/appdata:/appdata
      - /var/run/docker.sock:/var/run/docker.sock
    logging: *default-logging

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "8096:8096"
      - "8920:8920"
    environment:
      <<: *common-env
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ./data/jellyfin/config:/config
      - ./data/jellyfin/cache:/cache
      - ${MEDIA_ROOT}:/media:ro  # Read-only to prevent accidental deletion
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging: *default-logging

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    restart: unless-stopped
    ports:
      - "5055:5055"
    environment:
      <<: *common-env
    volumes:
      - ./data/jellyseerr/config:/app/config
    logging: *default-logging

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    restart: unless-stopped
    ports:
      - "13378:80"
    environment:
      <<: *common-env
    volumes:
      - ./data/audiobookshelf/config:/config
      - ./data/audiobookshelf/metadata:/metadata
      - ${MEDIA_ROOT}/audiobooks:/audiobooks
      - ${MEDIA_ROOT}/podcasts:/podcasts
    logging: *default-logging

  calibre-web:
    image: lscr.io/linuxserver/calibre-web:latest
    container_name: calibre-web
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      <<: *common-env
      DOCKER_MODS: linuxserver/mods:universal-calibre
    volumes:
      - ./data/calibre-web/config:/config
      - ${MEDIA_ROOT}/books:/books
    logging: *default-logging

  # ============================================
  # PRIVATE ADMIN SERVICES
  # (Access via LAN or Tailscale on host)
  # ============================================

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    ports:
      - "8989:8989"
    environment:
      <<: *common-env
    volumes:
      - ./data/sonarr/config:/config
      - *common-vol
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/ping"]
      interval: 60s
      timeout: 10s
      retries: 3
    logging: *default-logging

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    ports:
      - "7878:7878"
    environment:
      <<: *common-env
    volumes:
      - ./data/radarr/config:/config
      - *common-vol
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878/ping"]
      interval: 60s
      timeout: 10s
      retries: 3
    logging: *default-logging

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    restart: unless-stopped
    ports:
      - "8686:8686"
    environment:
      <<: *common-env
    volumes:
      - ./data/lidarr/config:/config
      - *common-vol
    logging: *default-logging

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    ports:
      - "9696:9696"
    environment:
      <<: *common-env
    volumes:
      - ./data/prowlarr/config:/config
      - *common-vol
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9696/ping"]
      interval: 60s
      timeout: 10s
      retries: 3
    logging: *default-logging

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    ports:
      - "8191:8191"
    environment:
      LOG_LEVEL: info
      LOG_HTML: false
      CAPTCHA_SOLVER: none
      TZ: ${TZ}
    logging: *default-logging

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    ports:
      - "6767:6767"
    environment:
      <<: *common-env
    volumes:
      - ./data/bazarr/config:/config
      - *common-vol
    logging: *default-logging

  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:latest
    container_name: recyclarr
    restart: unless-stopped
    user: ${PUID}:${PGID}
    environment:
      TZ: ${TZ}
    volumes:
      - ./data/recyclarr/config:/config
    logging: *default-logging

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    environment:
      <<: *common-env
      WEBUI_PORT: 8080
    volumes:
      - ./data/qbittorrent/config:/config
      - ${MEDIA_ROOT}/downloads:/downloads
      - *common-vol
    logging: *default-logging

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      <<: *common-env
    volumes:
      - ./data/sabnzbd/config:/config
      - ${MEDIA_ROOT}/downloads:/downloads
      - *common-vol
    logging: *default-logging

  tdarr:
    image: ghcr.io/haveagitgat/tdarr:latest
    container_name: tdarr
    restart: unless-stopped
    ports:
      - "8265:8265"  # Web UI
      - "8266:8266"  # Server port
    environment:
      <<: *common-env
      serverIP: 0.0.0.0
      serverPort: 8266
      webUIPort: 8265
      internalNode: "true"
      nodeName: HomeLabNode
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ./data/tdarr/server:/app/server
      - ./data/tdarr/configs:/app/configs
      - ./data/tdarr/logs:/app/logs
      - ./data/tdarr/temp:/temp
      - ${MEDIA_ROOT}:/media:ro  # Read-only to prevent accidental deletion
    logging: *default-logging

  arm:
    image: automaticrippingmachine/automatic-ripping-machine:latest
    container_name: arm
    restart: unless-stopped
    privileged: true  # Required for full optical drive access and udev integration
    ports:
      - "8090:8080"  # Web UI
    environment:
      <<: *common-env
      ARM_UID: ${PUID}
      ARM_GID: ${PGID}
    devices:
      - /dev/sr0:/dev/sr0
      - /dev/sg1:/dev/sg1  # SCSI generic device for optical drive
      - /dev/dri:/dev/dri  # GPU hardware acceleration for transcoding
    volumes:
      - ./data/arm/config:/etc/arm/config
      - ./data/arm/db:/home/arm/db
      - ./data/arm/logs:/home/arm/logs
      - ./data/arm/media:/home/arm/media  # Temporary storage during ripping
      - ${MEDIA_ROOT}/movies:/home/arm/movies  # Final output location
      - /run/udev:/run/udev:ro  # udev events for automatic disc detection
    logging: *default-logging

  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
    logging: *default-logging

  # ============================================
  # SHARED BACKEND SERVICES
  # ============================================

  postgres:
    image: tensorchord/pgvecto-rs:pg14-v0.2.0
    container_name: postgres
    restart: unless-stopped
    # ports: Intentionally not exposed - use 'docker exec' for admin access
    environment:
      POSTGRES_USER: ${DB_USER:-homelab}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: immich  # Create immich database automatically
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-immich-database.sh:/docker-entrypoint-initdb.d/init-immich-database.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-homelab}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - backend
      - default
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    # ports: Intentionally not exposed - use 'docker exec' for admin access
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - backend
      - default
    logging: *default-logging

  # ============================================
  # PHOTO MANAGEMENT
  # ============================================

  immich-server:
    image: ghcr.io/immich-app/immich-server:release
    container_name: immich-server
    restart: unless-stopped
    ports:
      - "2283:3001"
    environment:
      <<: *common-env
      DB_HOSTNAME: postgres
      DB_USERNAME: ${DB_USER:-homelab}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      UPLOAD_LOCATION: /photos
    volumes:
      - ${MEDIA_ROOT}/photos:/photos
      - ./data/immich:/usr/src/app/upload
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
      - default
    logging: *default-logging

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:release
    container_name: immich-machine-learning
    restart: unless-stopped
    environment:
      <<: *common-env
    volumes:
      - ./data/immich/model-cache:/cache
    logging: *default-logging

  # ============================================
  # OPEN VOICE OS - Voice Assistant
  # ============================================

  ovos-messagebus:
    image: smartgic/ovos-messagebus:alpha
    container_name: ovos-messagebus
    restart: unless-stopped
    ports:
      - "8181:8181"
    environment:
      <<: *common-env
    volumes:
      - ./data/ovos/config:/home/ovos/.config/mycroft:ro
      - ./data/ovos/tmp:/tmp/mycroft
    logging: *default-logging

  ovos-core:
    image: smartgic/ovos-core:alpha
    container_name: ovos-core
    restart: unless-stopped
    environment:
      <<: *common-env
    volumes:
      - ./data/ovos/config:/home/ovos/.config/mycroft:ro
      - ./data/ovos/share:/home/ovos/.local/share/mycroft
      - ./data/ovos/tmp:/tmp/mycroft
    depends_on:
      - ovos-messagebus
    logging: *default-logging

  ovos-audio:
    image: smartgic/ovos-audio:alpha
    container_name: ovos-audio
    restart: unless-stopped
    environment:
      <<: *common-env
      PULSE_SERVER: unix:/run/user/1000/pulse/native
    volumes:
      - ./data/ovos/config:/home/ovos/.config/mycroft:ro
      - ./data/ovos/share:/home/ovos/.local/share/mycroft
      - ./data/ovos/tmp:/tmp/mycroft
      - /run/user/1000/pulse:/run/user/1000/pulse:ro
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - audio
    depends_on:
      - ovos-messagebus
    logging: *default-logging

  ovos-listener:
    image: smartgic/ovos-listener:alpha
    container_name: ovos-listener
    restart: unless-stopped
    environment:
      <<: *common-env
      PULSE_SERVER: unix:/run/user/1000/pulse/native
    volumes:
      - ./data/ovos/config:/home/ovos/.config/mycroft:ro
      - ./data/ovos/share:/home/ovos/.local/share/mycroft
      - ./data/ovos/tmp:/tmp/mycroft
      - /run/user/1000/pulse:/run/user/1000/pulse:ro
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - audio
    depends_on:
      - ovos-messagebus
    logging: *default-logging

  ovos-phal:
    image: smartgic/ovos-phal:alpha
    container_name: ovos-phal
    restart: unless-stopped
    environment:
      <<: *common-env
      PULSE_SERVER: unix:/run/user/1000/pulse/native
    volumes:
      - ./data/ovos/config:/home/ovos/.config/mycroft:ro
      - ./data/ovos/config/phal:/home/ovos/.config/mycroft/phal:ro
      - ./data/ovos/share:/home/ovos/.local/share/mycroft
      - ./data/ovos/tmp:/tmp/mycroft
      - /run/user/1000/pulse:/run/user/1000/pulse:ro
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - audio
    depends_on:
      - ovos-messagebus
    logging: *default-logging

  ovos-gui:
    image: smartgic/ovos-gui:alpha
    container_name: ovos-gui
    restart: unless-stopped
    ports:
      - "8484:8484"
    environment:
      <<: *common-env
      DISPLAY: :0
    volumes:
      - ./data/ovos/config:/home/ovos/.config/mycroft:ro
      - ./data/ovos/share:/home/ovos/.local/share/mycroft
      - ./data/ovos/tmp:/tmp/mycroft
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    depends_on:
      - ovos-messagebus
    logging: *default-logging

volumes:
  uptime_kuma_data:
  postgres_data:
  redis_data:

networks:
  backend:
    name: homelab_backend
    driver: bridge
