x-common-env: &common-env
  PUID: ${PUID}
  PGID: ${PGID}
  TZ: ${TZ}

x-common-vol: &common-vol
  ${MEDIA_ROOT}:/media

# Logging configuration to prevent disk space issues
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ============================================
  # REMOTE ACCESS & NETWORKING
  # ============================================

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    logging: *default-logging

  # ============================================
  # PUBLIC USER-FACING SERVICES
  # (Accessible via Cloudflare Tunnel)
  # ============================================

  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    container_name: homarr
    restart: unless-stopped
    ports:
      - "7575:7575"
    environment:
      SECRET_ENCRYPTION_KEY: ${HOMARR_ENCRYPTION_KEY}
    volumes:
      - ./data/homarr/appdata:/appdata
      - /var/run/docker.sock:/var/run/docker.sock
    logging: *default-logging

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "8096:8096"
      - "8920:8920"
    environment:
      <<: *common-env
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ./data/jellyfin/config:/config
      - ./data/jellyfin/cache:/cache
      - ${MEDIA_ROOT}:/media:ro  # Read-only to prevent accidental deletion
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging: *default-logging

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    restart: unless-stopped
    ports:
      - "5055:5055"
    environment:
      <<: *common-env
    volumes:
      - ./data/jellyseerr/config:/app/config
    logging: *default-logging

  # ============================================
  # PRIVATE ADMIN SERVICES
  # (Access via LAN only)
  # ============================================

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    ports:
      - "8989:8989"
    environment:
      <<: *common-env
    volumes:
      - ./data/sonarr/config:/config
      - *common-vol
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/ping"]
      interval: 60s
      timeout: 10s
      retries: 3
    logging: *default-logging

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    ports:
      - "7878:7878"
    environment:
      <<: *common-env
    volumes:
      - ./data/radarr/config:/config
      - *common-vol
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878/ping"]
      interval: 60s
      timeout: 10s
      retries: 3
    logging: *default-logging

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    restart: unless-stopped
    ports:
      - "8686:8686"
    environment:
      <<: *common-env
    volumes:
      - ./data/lidarr/config:/config
      - *common-vol
    logging: *default-logging

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    ports:
      - "9696:9696"
    environment:
      <<: *common-env
    volumes:
      - ./data/prowlarr/config:/config
      - *common-vol
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9696/ping"]
      interval: 60s
      timeout: 10s
      retries: 3
    logging: *default-logging

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    ports:
      - "8191:8191"
    environment:
      LOG_LEVEL: info
      LOG_HTML: false
      CAPTCHA_SOLVER: none
      TZ: ${TZ}
    logging: *default-logging

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    ports:
      - "6767:6767"
    environment:
      <<: *common-env
    volumes:
      - ./data/bazarr/config:/config
      - *common-vol
    logging: *default-logging

  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:latest
    container_name: recyclarr
    restart: unless-stopped
    user: ${PUID}:${PGID}
    environment:
      TZ: ${TZ}
    volumes:
      - ./data/recyclarr/config:/config
    logging: *default-logging

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    environment:
      <<: *common-env
      WEBUI_PORT: 8080
    volumes:
      - ./data/qbittorrent/config:/config
      - ${MEDIA_ROOT}/downloads:/downloads
      - *common-vol
    logging: *default-logging

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      <<: *common-env
    volumes:
      - ./data/sabnzbd/config:/config
      - ${MEDIA_ROOT}/downloads:/downloads
      - *common-vol
    logging: *default-logging

  tdarr:
    image: ghcr.io/haveagitgat/tdarr:latest
    container_name: tdarr
    restart: unless-stopped
    ports:
      - "8265:8265"  # Web UI
      - "8266:8266"  # Server port
    environment:
      <<: *common-env
      serverIP: 0.0.0.0
      serverPort: 8266
      webUIPort: 8265
      internalNode: "true"
      nodeName: HomeLabNode
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ./data/tdarr/server:/app/server
      - ./data/tdarr/configs:/app/configs
      - ./data/tdarr/logs:/app/logs
      - ./data/tdarr/temp:/temp
      - ${MEDIA_ROOT}:/media  # Read-write for transcoding ARM rips
    logging: *default-logging

  arm:
    image: automaticrippingmachine/automatic-ripping-machine:latest
    container_name: arm
    restart: unless-stopped
    privileged: true  # Required for full optical drive access and udev integration
    ports:
      - "8090:8080"  # Web UI
    environment:
      <<: *common-env
      ARM_UID: ${PUID}
      ARM_GID: ${PGID}
    devices:
      - ${OPTICAL_DRIVE:-/dev/sr0}:${OPTICAL_DRIVE:-/dev/sr0}  # Auto-detected optical drive
      - ${OPTICAL_SG_DEVICE:-/dev/sg1}:${OPTICAL_SG_DEVICE:-/dev/sg1}  # SCSI generic device
      - /dev/dri:/dev/dri  # GPU hardware acceleration for transcoding
    volumes:
      - ./data/arm/config:/etc/arm/config
      - ./data/arm/db:/home/arm/db
      - ./data/arm/logs:/home/arm/logs
      - ${MEDIA_ROOT}/arm:/home/arm/media  # Temporary storage during ripping (on external drive)
      - ${MEDIA_ROOT}:/home/arm/movies  # Final output (ARM adds movies/ or tv/ subfolder)
      - /run/udev:/run/udev:ro  # udev events for automatic disc detection
    logging: *default-logging

  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
    logging: *default-logging

volumes:
  uptime_kuma_data:
