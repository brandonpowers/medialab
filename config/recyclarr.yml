# Recyclarr Configuration
# Automatically syncs TRaSH Guides quality profiles to Sonarr and Radarr
# Documentation: https://recyclarr.dev/

# Sonarr Configuration
sonarr:
  tv-shows:
    base_url: http://sonarr:8989
    api_key: !env_var SONARR_API_KEY

    # Delete old custom formats not in the guide
    delete_old_custom_formats: true

    # Replace existing custom formats (recommended)
    replace_existing_custom_formats: true

    quality_definition:
      type: series

    # TRaSH Guides - WEB-DL Quality Profile (1080p)
    quality_profiles:
      - name: WEB-1080p
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: WEB 1080p
          until_score: 10000
        min_format_score: 0
        quality_sort: top
        qualities:
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
          - name: HDTV-1080p
          - name: WEB 720p
            qualities:
              - WEBDL-720p
              - WEBRip-720p
          - name: HDTV-720p

    # Custom Formats from TRaSH Guides
    custom_formats:
      # Streaming Services (positive scores)
      - trash_ids:
          - d6819cba26b1a6508138d25fb5e32293  # AMZN (Amazon)
          - 77a7b25585c18af08f60b1547bb9b4fb  # ATVP (Apple TV+)
          - 36b72f59f4ea20aad9316f475f2d9fbb  # DCU (DC Universe)
          - 89358767a60cc28783cdc3d0be9388a4  # DSNP (Disney+)
          - 7a235133c87f7da4c8cccceca7e3c7a6  # HBO (HBO Max)
          - a880d6abc21e7c16884f3ae393f84179  # HULU
          - 3ac5d84fce98bab1b531393e9c82f467  # iT (iTunes)
          - d34870697c9db575f17700212167be23  # NF (Netflix)
          - 1656adc6d7bb2c8cca6acfb6592db421  # PCOK (Peacock)
        assign_scores_to:
          - name: WEB-1080p

      # Unwanted content (negative scores)
      - trash_ids:
          - 85c61753df5da1fb2aab6f2a47426b09  # BR-DISK
          - 9c11cd3f07101cdba90a2d81cf0e56b4  # LQ
          - 47435ece6b99a0b477caf360e79ba0bb  # x265 (HD)
        assign_scores_to:
          - name: WEB-1080p
            score: -10000

# Radarr Configuration
radarr:
  movies:
    base_url: http://radarr:7878
    api_key: !env_var RADARR_API_KEY

    delete_old_custom_formats: true
    replace_existing_custom_formats: true

    quality_definition:
      type: movie
      preferred_ratio: 0.5

    # TRaSH Guides - HD Bluray + WEB Quality Profile
    quality_profiles:
      - name: HD-1080p
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: Bluray-1080p
          until_score: 10000
        min_format_score: 0
        quality_sort: top
        qualities:
          - name: Bluray-1080p
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
          - name: Bluray-720p
          - name: WEB 720p
            qualities:
              - WEBDL-720p
              - WEBRip-720p

    custom_formats:
