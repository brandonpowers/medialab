name: Deploy Homelab Stack

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull latest images
        run: docker compose pull

      - name: Deploy stack
        run: |
          docker compose up -d --remove-orphans

      - name: Wait for services to stabilize
        run: sleep 30

      - name: Verify critical services
        run: |
          echo "Checking postgres..."
          docker exec postgres pg_isready -U homelab || exit 1

          echo "Checking redis..."
          docker exec redis redis-cli --raw incr ping || exit 1

          echo "Checking gitea..."
          docker exec gitea wget -q --spider http://localhost:3000 || exit 1

          echo "All critical services healthy!"

      - name: Clean up old images
        run: docker image prune -f

      - name: Report status
        if: always()
        run: |
          echo "Deployment completed at $(date)"
          docker compose ps
